<!DOCTYPE html>
<html>
<head>
    <title>Aikido Shinjukai Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Aikido Shinjukai</h1>
    <h2>Login</h2>

    <form id="loginForm">

        <label>Email:</label>
        <input
            type="email"
            id="email"
            required
        >

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            id="password"
            required
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

    <script src="js/login.js"></script>

</body>
</html>
